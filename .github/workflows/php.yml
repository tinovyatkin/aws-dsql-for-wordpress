name: PHP Composer

on:
  push:
    branches: [ "v2", "v3" ]
  pull_request:
    branches: [ "v2", "v3" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_pgsql
        tools: composer
        coverage: none

    - name: Install dependencies
      run: composer install --no-interaction --no-progress

    - name: Run Tests
      run: |
        php tests/tools/phpunit.phar tests/
        php tests/translation/cache.php
        php tests/mysql-parser/helpers.php
        php tests/mysql-parser/corpus.php
        php tests/upgrade/parser.php

    - name: Check parser regeneration
      run: |
        python3 scripts/generate-mysql-parser.py
        git diff --exit-code -- parser/mysql/Generated
