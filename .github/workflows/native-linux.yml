name: Native Linux PHP extension
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [native/**, .dockerignore, .github/workflows/native-linux.yml]
  pull_request:
    branches: [main]
    paths: [native/**, .dockerignore, .github/workflows/native-linux.yml]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test Debian 12 amd64 PHP ${{ matrix.php }} extension
        uses: docker/build-push-action@v6
        with:
          context: .
          file: native/build/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            PHP_MINOR=${{ matrix.php }}
          platforms: linux/amd64
          target: artifact
          outputs: type=local,dest=artifact
          cache-from: type=gha,scope=sury-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=sury-php${{ matrix.php }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-php${{ matrix.php }}-nts-debian12-amd64
          path: artifact/
          retention-days: 14
