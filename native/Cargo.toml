[package]
name = "wp-dsql-native"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["php"]
php = ["dep:ext-php-rs"]

[dependencies]
ext-php-rs = { version = "=0.15.15", optional = true }
sqlparser = { version = "=0.63.0", features = ["visitor"] }
aurora-dsql-sqlx-connector = { version = "=0.2.2", features = ["pool"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "chrono", "bigdecimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
lru = "0.16"
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = "debuginfo"

[dev-dependencies]
